components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required:
        - error
        - requestId
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - TOO_MANY_REQUESTS
                - INTERNAL_ERROR
            message:
              type: string
            details: {}
        requestId:
          type: string
    Pagination:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalPages:
          type: integer
          minimum: 0
    Product:
      type: object
      required:
        - id
        - sku
        - name
        - slug
        - price
        - stock
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        nameEn:
          type: string
        slug:
          type: string
        price:
          type: number
        discountPercent:
          type: integer
        stock:
          type: integer
        images:
          type: array
          items:
            type: string
    Order:
      type: object
      required:
        - id
        - total
        - status
      properties:
        id:
          type: string
        total:
          type: number
        status:
          type: string
        paymentMethod:
          type: string
        paymentStatus:
          type: string
        structuredItems:
          type: array
          items:
            type: object
            additionalProperties: true
    Checkout:
      type: object
      required:
        - items
        - paymentMethod
        - shipping
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - paintId
              - quantity
            properties:
              paintId:
                type: string
              colorId:
                type: string
              quantity:
                type: integer
                minimum: 1
        paymentMethod:
          type: string
          enum:
            - COD
            - TRANSFER
            - VNPAY
        couponCode:
          type: string
        note:
          type: string
        shipping:
          type: object
          required:
            - fullName
            - phone
            - addressLine1
            - district
            - province
          properties:
            fullName:
              type: string
            phone:
              type: string
            addressLine1:
              type: string
            addressLine2:
              type: string
            district:
              type: string
            province:
              type: string
    GenericObject:
      type: object
      additionalProperties: true
    GenericArray:
      type: array
      items:
        $ref: "#/components/schemas/GenericObject"
    Success:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          const: true
    Category:
      type: object
      required:
        - id
        - name
        - slug
        - isActive
      properties:
        id:
          type: string
        name:
          type: string
        nameEn:
          type:
            - string
            - "null"
        slug:
          type: string
        description:
          type:
            - string
            - "null"
        sortOrder:
          type: integer
        isActive:
          type: boolean
    Review:
      type: object
      required:
        - id
        - rating
        - comment
      properties:
        id:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        adminReply:
          type:
            - string
            - "null"
    QuoteRequest:
      type: object
      required:
        - id
        - fullName
        - phone
        - email
        - projectType
        - status
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        projectType:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - CONTACTED
            - QUOTED
            - CLOSED
        adminNote:
          type:
            - string
            - "null"
    Message:
      type: object
      required:
        - id
        - conversationId
        - senderId
        - isAdmin
        - content
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        isAdmin:
          type: boolean
        content:
          type: string
        isRead:
          type: boolean
    Conversation:
      type: object
      required:
        - id
        - userId
        - status
        - messages
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          type: string
          enum:
            - NEW
            - IN_PROGRESS
            - CLOSED
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    Notification:
      type: object
      required:
        - id
        - userId
        - type
        - title
        - message
        - isRead
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
    AuditLog:
      type: object
      required:
        - id
        - actorId
        - actorEmail
        - action
        - entityType
      properties:
        id:
          type: string
        actorId:
          type: string
        actorEmail:
          type: string
          format: email
        action:
          type: string
        entityType:
          type: string
        entityId:
          type:
            - string
            - "null"
